name: FFmpeg editor
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake g++ make pkg-config libwxgtk3.2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libsdl2-dev nlohmann-json3-dev ffmpeg xvfb xauth
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEDITOR_TEST_MEDIA=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Draw the first frame of the 10,000-caption fixture
        run: SDL_AUDIODRIVER=dummy xvfb-run -a timeout 15s ./build/meditor --smoke-test build/media-fixture/fixture.json

  windows:
    name: Windows tests and screenshot
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: Install native Windows dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-wxwidgets3.2-msw
      - name: Configure and build Release
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMEDITOR_TEST_MEDIA=ON
          cmake --build build --parallel 2
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure
      - name: Capture the editor with the 10,000-caption fixture
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          png="$(cygpath -u "$RUNNER_TEMP")/meditor-windows.png"
          rm -f "$png"
          timeout --foreground --kill-after=5s 30s ./build/meditor.exe --smoke-test \
            build/media-fixture/fixture.json "$png"
          test -s "$png"
      - name: Upload Windows screenshot
        id: screenshot
        uses: actions/upload-artifact@v4
        with:
          name: meditor-windows-screenshot
          path: ${{ runner.temp }}/meditor-windows.png
          if-no-files-found: error
          retention-days: 14
      - name: Link screenshot from the PR check
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.screenshot.outputs.artifact-url }}
        run: |
          @"
          ## Windows screenshot

          [Download meditor-windows.png (ZIP)]($env:ARTIFACT_URL)

          The Windows editor rendered the synthetic video with 10,000 captions and three audio tracks loaded.
          "@ >> $env:GITHUB_STEP_SUMMARY
