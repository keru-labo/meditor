name: FFmpeg editor
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake g++ make pkg-config libwxgtk3.2-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libsdl2-dev nlohmann-json3-dev ffmpeg xvfb xauth
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMEDITOR_TEST_MEDIA=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Draw the first frame of the 10,000-caption fixture
        run: SDL_AUDIODRIVER=dummy xvfb-run -a timeout 15s ./build/meditor --smoke-test build/media-fixture/fixture.json

  windows:
    name: Windows tests and screenshot
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: meditor-vcpkg-windows-2022-${{ hashFiles('vcpkg.json', 'tools/vcpkg/*.cmake') }}
          restore-keys: meditor-vcpkg-windows-2022-
      - name: Prepare dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          }
          ffmpeg -version
      - name: Configure and build Release
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            "-DVCPKG_OVERLAY_TRIPLETS=$PWD/tools/vcpkg" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release -DMEDITOR_TEST_MEDIA=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --parallel 2
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Capture the editor with the 10,000-caption fixture
        shell: pwsh
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          $png = Join-Path $env:RUNNER_TEMP 'meditor-windows.png'
          Remove-Item -LiteralPath $png -ErrorAction SilentlyContinue
          $fixture = Join-Path $PWD 'build/media-fixture/fixture.json'
          $editor = Start-Process -FilePath 'build/Release/meditor.exe' -PassThru -NoNewWindow `
            -ArgumentList ('--smoke-test "{0}" "{1}"' -f $fixture, $png)
          if (-not $editor.WaitForExit(30000)) {
            $editor.Kill()
            throw "The editor did not draw and capture the fixture within 30 seconds."
          }
          if ($editor.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $png -PathType Leaf)) {
            throw "The editor failed to produce a screenshot (exit $($editor.ExitCode))."
          }
      - name: Upload Windows screenshot
        id: screenshot
        uses: actions/upload-artifact@v4
        with:
          name: meditor-windows-screenshot
          path: ${{ runner.temp }}/meditor-windows.png
          if-no-files-found: error
          retention-days: 14
      - name: Link screenshot from the PR check
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.screenshot.outputs.artifact-url }}
        run: |
          @"
          ## Windows screenshot

          [Download meditor-windows.png (ZIP)]($env:ARTIFACT_URL)

          The Windows editor rendered the synthetic video with 10,000 captions and three audio tracks loaded.
          "@ >> $env:GITHUB_STEP_SUMMARY
