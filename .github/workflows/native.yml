name: meditor
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: meditor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Rust tests on Linux
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 25
    env:
      # This lane checks correctness. Windows still uses the default release profile.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '1'
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libclang-dev libfontconfig-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libsdl2-dev ffmpeg xvfb xauth libxkbcommon-x11-0 fonts-noto-cjk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          cache-on-failure: true
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --release --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked --release
      - name: Exercise preview and feature captures with 10,000 captions
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          rust/target/release/meditor-fixture artifacts/fixture
          xvfb-run -a timeout 55s rust/target/release/meditor --feature-screenshots artifacts/fixture/fixture.json artifacts/feature-screenshots
          for name in editor subtitle-style subtitle-preview ai-edit export-settings; do
            test -s "artifacts/feature-screenshots/$name.png"
          done
      - name: Verify the history BDD detects a known regression
        shell: bash
        run: |
          mutation=$(mktemp -d "$RUNNER_TEMP/history-mutation.XXXXXX")
          trap 'rm -rf "$mutation"' EXIT
          tar --exclude=rust/target -cf - rust docs/features/edit-history.feature | tar -xf - -C "$mutation"
          history="$mutation/rust/src/history.rs"
          if [ "$(grep -Fxc '            self.redo.clear();' "$history")" -ne 1 ]; then
            echo "::error::Could not locate one redo-clearing statement"
            exit 1
          fi
          sed -i '/^            self\.redo\.clear();$/d' "$history"
          cargo test --manifest-path "$mutation/rust/Cargo.toml" \
            --target-dir "$mutation/target" --locked --release \
            --test history_bdd -- --ignored --exact --nocapture history_bdd_detects_redo_regression \
            | tee "$mutation/history-bdd.log"
          if ! grep -q '^DETECTED docs/features/edit-history.feature:' "$mutation/history-bdd.log"; then
            echo "::error::The history BDD did not report the redo regression"
            exit 1
          fi

  windows:
    name: Windows tests and screenshot
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: '1.100.0'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          cache-on-failure: true
      - name: Prepare pinned FFmpeg SDK
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-sdk.7z'
          $sdk = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.1-full_build-shared'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.1/ffmpeg-9.1-full_build-shared.7z'
          $expected = '6bc6f09cd4379ed914489728044c1e0115861a9d47f7a1c07d71b8bec02708d7'
          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "FFmpeg SDK hash mismatch"
          }
          & "$env:ProgramFiles/7-Zip/7z.exe" x -y "-o$env:RUNNER_TEMP" $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "FFMPEG_DIR=$sdk" >> $env:GITHUB_ENV
          (Join-Path $sdk 'bin') >> $env:GITHUB_PATH
      - name: Build and test the Rust editor
        run: |
          $env:LIBCLANG_PATH = Join-Path $env:ProgramFiles 'LLVM/bin'
          cargo test --manifest-path rust/Cargo.toml --locked --release
          exit $LASTEXITCODE
      - name: Capture feature screenshots with the 10,000-caption fixture
        env:
          SDL_AUDIODRIVER: dummy
        run: |
          & rust/target/release/meditor-fixture.exe artifacts/fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $screenshots = Join-Path $env:RUNNER_TEMP 'meditor-windows-screenshots'
          New-Item -ItemType Directory -Path $screenshots -ErrorAction Stop | Out-Null
          $stderr = Join-Path $env:RUNNER_TEMP 'meditor-windows.stderr.txt'
          $app = Start-Process -FilePath rust/target/release/meditor.exe `
            -ArgumentList '--feature-screenshots', 'artifacts/fixture/fixture.json', "`"$screenshots`"" -NoNewWindow -PassThru -RedirectStandardError $stderr
          if (-not $app.WaitForExit(55000)) { $app.Kill(); throw 'Rust editor screenshot timed out' }
          if ($app.ExitCode -ne 0) {
            Get-Content -LiteralPath $stderr
            throw "Rust editor screenshot failed ($($app.ExitCode))"
          }
          foreach ($name in @('editor', 'subtitle-style', 'subtitle-preview', 'ai-edit', 'export-settings')) {
            $png = Join-Path $screenshots "$name.png"
            if (-not (Test-Path -LiteralPath $png -PathType Leaf) -or (Get-Item -LiteralPath $png).Length -eq 0) {
              throw "Missing or empty Windows screenshot: $name.png"
            }
          }
      - name: Upload Windows screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meditor-windows-screenshots
          path: ${{ runner.temp }}/meditor-windows-screenshots/*.png
          if-no-files-found: error
          retention-days: 14

  screenshot-comment:
    name: Post Windows screenshot to PR
    needs: windows
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: meditor-screenshot-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: meditor-windows-screenshots
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const event = context.payload.pull_request;
            const number = event.number;
            const isCurrentHead = async () => {
              const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              return current.state === 'open' && current.head.sha === event.head.sha;
            };
            if (!await isCurrentHead()) return;

            const screenshots = [
              ['editor.png', '編集画面と字幕一覧'],
              ['subtitle-style.png', '字幕スタイルの設定'],
              ['subtitle-preview.png', 'スタイル適用後の字幕プレビュー'],
              ['ai-edit.png', 'AI 編集パネル'],
              ['export-settings.png', 'MP4 の書き出し設定']
            ].map(([path, title]) => {
              const png = fs.readFileSync(path);
              if (png.length < 24 || png.length > 2 * 1024 * 1024 ||
                  png.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a' ||
                  png.subarray(12, 16).toString('ascii') !== 'IHDR') {
                throw new Error(`Expected a Windows screenshot PNG of at most 2 MiB: ${path}`);
              }
              return { path, title, png };
            });

            const branch = `ci/screenshots/pr-${number}`;
            let ref;
            try {
              ({ data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            let imageCommit = ref?.object.sha ?? event.base.sha;
            const { data: parent } = await github.rest.git.getCommit({
              owner, repo, commit_sha: imageCommit
            });
            const files = await Promise.all(screenshots.map(async ({ path, png }) => {
              const { data: blob } = await github.rest.git.createBlob({
                owner, repo, content: png.toString('base64'), encoding: 'base64'
              });
              return { path, mode: '100644', type: 'blob', sha: blob.sha };
            }));
            const { data: tree } = await github.rest.git.createTree({
              owner, repo, base_tree: parent.tree.sha, tree: files
            });
            if (tree.sha !== parent.tree.sha || !ref) {
              const { data: commit } = await github.rest.git.createCommit({
                owner, repo, tree: tree.sha, parents: [imageCommit],
                message: `Update Windows screenshots for PR #${number}`
              });
              imageCommit = commit.sha;
              if (ref) {
                await github.rest.git.updateRef({
                  owner, repo, ref: `heads/${branch}`, sha: imageCommit, force: false
                });
              } else {
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/heads/${branch}`, sha: imageCommit
                });
              }
            }

            const marker = '<!-- meditor-windows-screenshot -->';
            const run = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Windows の機能別スクリーンショット',
              ...screenshots.map(({ path, title }) => {
                const image = `https://raw.githubusercontent.com/${owner}/${repo}/${imageCommit}/${path}`;
                return `#### ${title}\n\n![${title}のスクリーンショット](${image})`;
              }),
              `字幕10,000件・音声3トラックの合成プロジェクト · [実行結果](${run}) · \`${event.head.sha.slice(0, 7)}\``
            ].join('\n\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number
            });
            const comment = comments.find(item =>
              item.user?.login === 'github-actions[bot]' && item.body?.startsWith(marker)
            );
            if (!await isCurrentHead()) return;
            if (comment) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
