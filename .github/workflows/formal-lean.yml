name: Lean seek model

on:
  pull_request:
    paths:
      - '.github/workflows/formal-lean.yml'
      - 'verification/lean/**'
      - 'rust/src/lib.rs'
      - 'rust/tests/seek_acceptance.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-lean.yml'
      - 'verification/lean/**'
      - 'rust/src/lib.rs'
      - 'rust/tests/seek_acceptance.rs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-seek-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Check the seek model
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check proof with the pinned Lean release
        working-directory: verification/lean
        shell: bash
        run: |
          toolchain=$(<lean-toolchain)
          [[ "$toolchain" =~ ^leanprover/lean4:v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
          asset="lean-${BASH_REMATCH[1]}-linux.tar.zst"
          archive="$RUNNER_TEMP/$asset"
          digest=6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            "https://github.com/leanprover/lean4/releases/download/${toolchain##*:}/$asset" \
            --output "$archive"
          printf '%s  %s\n' "$digest" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd --extract --file "$archive" --directory "$RUNNER_TEMP/lean" --strip-components 1
          "$RUNNER_TEMP/lean/bin/lean" --version
          "$RUNNER_TEMP/lean/bin/lean" -DwarningAsError=true SeekController.lean
