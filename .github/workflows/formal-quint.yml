name: Quint chat edit model

on:
  pull_request:
    paths:
      - '.github/workflows/formal-quint.yml'
      - 'verification/quint/**'
      - 'docs/features/**'
      - 'rust/src/chat.rs'
      - 'rust/src/main.rs'
      - 'rust/src/history.rs'
      - 'rust/src/project.rs'
      - 'rust/tests/history_acceptance.rs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formal-quint.yml'
      - 'verification/quint/**'
      - 'docs/features/**'
      - 'rust/src/chat.rs'
      - 'rust/src/main.rs'
      - 'rust/src/history.rs'
      - 'rust/src/project.rs'
      - 'rust/tests/history_acceptance.rs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-edit:
    name: Check the chat edit model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: verification/quint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run check
