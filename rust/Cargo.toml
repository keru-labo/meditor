[package]
name = "meditor-playback"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "meditor"

[[bin]]
name = "meditor"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
ffmpeg-next = { version = "=9.1.0", default-features = false, features = ["codec", "format", "software-scaling"] }
hound = "=3.5.1"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
pathdiff = "=0.2.3"
regex = "=1.13.2"
rfd = { version = "=0.16.1", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
slint = { version = "=1.15.1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
tempfile = "=3.27.0"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }

[build-dependencies]
slint-build = "=1.15.1"

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "=0.38.1", features = ["bundled", "static-link"] }

[target.'cfg(not(windows))'.dependencies]
sdl2 = { version = "=0.38.1", features = ["use-pkgconfig"] }
