[package]
name = "meditor-playback"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "meditor"

[[bin]]
name = "meditor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
pathdiff = "0.2"
regex = "1"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.15.1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
tempfile = "3"

[build-dependencies]
slint-build = "=1.15.1"

[target.'cfg(windows)'.dependencies]
sdl2 = { version = "0.38", features = ["bundled", "static-link"] }

[target.'cfg(not(windows))'.dependencies]
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
